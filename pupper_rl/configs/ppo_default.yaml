# Default MJX + brax PPO config for Pupper v3.
# Override any key from CLI: python train.py ppo.learning_rate=1e-4 ppo.num_envs=1024

seed: 24
algo: ppo

wandb:
  enabled: true
  project: pupperv3-mjx-rl   # must match download_latest_policy.py
  entity: null               # null -> logged-in user's default entity
  mode: online               # online | offline | disabled

env:
  model_xml: ../../pupperv3-monorepo/ros2_ws/src/pupper_v3_description/description/mujoco_xml/pupper_v3_complete.mjx.position.xml
  reward_file: ../reward.py   # read-only, never edited
  ctrl_dt: 0.02            # 50 Hz policy (matches neural_controller)
  action_scale: 0.75
  observation_history: 20  # robot expects in_shape = history * 36
  default_joint_pos: [0.26, 0.0, -0.52, -0.26, 0.0, 0.52, 0.26, 0.0, -0.52, -0.26, 0.0, 0.52]
  joint_lower_limits: [-1.22, -0.42, -2.79, -2.51, -3.14, -0.71, -1.22, -0.42, -2.79, -2.51, -3.14, -0.71]
  joint_upper_limits: [2.51, 3.14, 0.71, 1.22, 0.42, 2.79, 2.51, 3.14, 0.71, 1.22, 0.42, 2.79]
  half_height: 0.280
  full_height: 0.380
  command_ranges:          # sampled per episode
    lin_vel_x: [-0.75, 0.75]
    lin_vel_y: [-0.5, 0.5]
    ang_vel_yaw: [-2.0, 2.0]
  init_randomization:        # start pose; false -> fixed drop from the home keyframe
    enabled: true
    joint_pos: 0.10         # rad +/-, vs tightest joint margin 0.42
    joint_vel: 0.5          # rad/s +/-
    torso_z: [0.07, 0.20]   # m, standing height is ~0.155
    roll_deg: [-7, 7]       # deg [lo, hi]; a bare number x means [-x, x]
    pitch_deg: [-7, 7]      # roll and pitch compound: 7 deg each = 9.9 deg of body tilt,
                            # asserted below 0.8 * terminal_body_angle (= 69 deg)
    yaw_deg: [-180, 180]    # commands are body-frame so full heading is free
    lin_vel: 0.2            # m/s +/- per axis
    ang_vel: 0.3            # rad/s +/- per axis
    settle_steps: 25        # env steps (x0.02 s) holding default_joint_pos before the episode
    ground_clearance: 0.002 # m, lowest collision geom is lifted to at least this

  terminal_body_z: 0.05
  terminal_body_angle: 1.5   # rad (86 deg); matches the robot's max_body_angle in
                             # neural_controller/launch/config.yaml, so the sim ends an
                             # episode exactly where the hardware estops
  reward_scales:           # keys = reward_<name> functions in reward.py
    tracking_lin_vel: 1.5
    tracking_ang_vel: 0.8
    tracking_orientation: 0.5
    lin_vel_z: -0.05
    ang_vel_xy: -0.002
    orientation: -0.0
    torques: -0.025
    joint_acceleration: -1.0e-6
    mechanical_work: 0.0
    action_rate: -0.1
    feet_air_time: 0.0
    stand_still: 0.01
    abduction_angle: -0.01
    foot_slip: -0.2
    termination: -100.0
    half_height: 50
    full_height: 250
  reward_params:           # non-env arguments of those functions
    tracking_sigma: 0.25
    command_threshold: 0.05     # stand_still: |cmd| below this counts as "stop"
    step_threshold: 500         # termination penalty only before this step
    minimum_airtime: 0.1
    desired_world_z_in_body_frame: [0.0, 0.0, 1.0]
  foot_contact_height: 0.015    # foot site z below this = ground contact (rest z ~0.005-0.011)
  collision_bodies: []          # bodies whose geoms feed reward_geom_collision

policy:
  hidden_sizes: [256, 128, 128, 128]
  value_hidden_sizes: [256, 128, 128, 128]
  activation: elu          # RTNeural export supports elu/relu/tanh

ppo:                       # passed to brax.training.agents.ppo.train
  num_timesteps: 350_000
  episode_length: 500
  num_envs: 512           # 8GB GPU; raise on bigger cards
  batch_size: 256          # batch_size * num_minibatches must be divisible by num_envs
  num_minibatches: 32
  num_updates_per_batch: 4
  unroll_length: 20
  learning_rate: 3.0e-5
  entropy_cost: 1.0e-2
  discounting: 0.97
  reward_scaling: 1.0
  normalize_observations: true   # baked into first layer at export
  action_repeat: 1
  num_evals: 11            # also = number of checkpoints

export:
  kp: 5.0                  # written into policy JSON
  kd: 0.25
  use_imu: true
  control_orientation: true

logging:
  output_root: outputs

render:
  mode: headless           # headless | human (viewer window) | video (mp4 -> W&B)
  every_evals: 1           # render every Nth eval/checkpoint
  episode_steps: 200       # rollout length for rendering
  width: 640
  height: 480
  camera: -1               # -1 = free camera, or a camera name

eval:
  episodes: 10
  monorepo: ../../pupperv3-monorepo
  randomize_start_pose: true      # per-episode home keyframe, reuses env.init_randomization
  ros_controller: neural_controller_test   # the controller whose model_path is test_policy.json
  ros_crun: /home/the_bloop/pupper/distrobox-setup/crun.sh   # sources jazzy + workspace, strips humble
  ros_episode_seconds: 10
  ros_launch_budget: 60           # extra seconds the launch may live (startup + teardown)
  ros_cleanup: true               # pkill stale "launch neural_controller" / ros2_control_node first
  commands:                       # one per episode: [vx, vy, yaw_rate]
    - [0.0, 0.0, 0.0]
    - [0.3, 0.0, 0.0]
    - [0.75, 0.0, 0.0]
    - [-0.5, 0.0, 0.0]
    - [0.0, 0.4, 0.0]
    - [0.0, -0.4, 0.0]
    - [0.0, 0.0, 1.5]
    - [0.0, 0.0, -1.5]
    - [0.4, 0.0, 1.0]
    - [0.3, 0.3, 0.0]
